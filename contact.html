<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — FreeBotHub.com</title>
<meta name="description" content="Contact FreeBotHub.com to submit a bot, report a broken link, or ask a question.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.FBH_PAGE_NAV = 'contact';</script>
</head>
<body>
<div id="navbar"></div>
<main>
  <div class="page-header">
    <div class="container"><h1>Contact Us</h1><p>Submit a bot, report a broken link, or send us a message.</p></div>
  </div>
  <div class="container">
    <div class="contact-form">
      <form id="contactForm">
        <div class="row-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="field">
            <label for="cName">Your Name</label>
            <input id="cName" type="text" required>
          </div>
          <div class="field">
            <label for="cEmail">Email</label>
            <input id="cEmail" type="email" required>
          </div>
        </div>
        <div class="field">
          <label for="cSubject">Subject</label>
          <input id="cSubject" type="text" placeholder="e.g. Submit a new bot, Report broken link" required>
        </div>
        <div class="field">
          <label for="cMsg">Message</label>
          <textarea id="cMsg" placeholder="If you are submitting a bot, include: name, category, platform, short description, destination URL." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        <p id="formNote" style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:14px;">
          This form opens your email client. Alternatively, email us directly at
          <a id="mailLink" href="#">—</a>.
        </p>
      </form>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(function(){
  const email = (window.FBH_CONFIG && window.FBH_CONFIG.contactEmail) || 'support@freebothub.com';
  const ml = document.getElementById('mailLink');
  if (ml) { ml.textContent = email; ml.href = 'mailto:' + email; }
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const n = encodeURIComponent(document.getElementById('cName').value);
    const em = encodeURIComponent(document.getElementById('cEmail').value);
    const s = encodeURIComponent(document.getElementById('cSubject').value);
    const m = encodeURIComponent(document.getElementById('cMsg').value);
    window.location.href = 'mailto:' + email + '?subject=' + s + '&body=' +
      'Name: ' + n + '%0AEmail: ' + em + '%0A%0A' + m;
    window.fbh && window.fbh.toast('Opening your email app…', 'success');
  });
})();
</script>
</body>
</html>
