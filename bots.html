<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Trading Bots — FreeBotHub.com</title>
<meta name="description" content="Browse and search all free trading bots. Filter by category and platform.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.FBH_PAGE_NAV = 'bots';</script>
</head>
<body>
<div id="navbar"></div>
<main>
  <div class="page-header">
    <div class="container">
      <h1>All Trading Bots</h1>
      <p>Search, filter and discover free bots across every category.</p>
    </div>
  </div>

  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <span>All Bots</span>
    </nav>

    <div class="filter-bar">
      <input class="grow" id="searchInput" type="search" placeholder="Search by bot name or description…">
      <label>Category
        <select id="catFilter">
          <option value="">All categories</option>
        </select>
      </label>
      <label>Platform
        <select id="platFilter">
          <option value="">All platforms</option>
        </select>
      </label>
      <label>Sort
        <select id="sortFilter">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="name">Name A→Z</option>
        </select>
      </label>
      <button class="btn btn-outline btn-sm" id="clearBtn">Clear</button>
    </div>

    <div class="bot-grid" id="botGrid">
      <div class="loader"><div class="spinner"></div>Loading bots…</div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/bots.js"></script>
</body>
</html>
